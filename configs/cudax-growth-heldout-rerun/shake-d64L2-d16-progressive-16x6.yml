# Re-run of rnd/cudax-growth progressive 16x6 under the YAML experiment harness.

meta:
  description: "CUDAX progressive growth held-out rerun: 16 divisions x 6 epochs"
  experiment: cudax-growth-heldout-rerun
  run_slug: progressive-16x6

corpus:
  path: data/input.txt
  train_frac: 0.95

model:
  init_from: data/input.model

train:
  tool: bin/agpt_train_v2
  mode: train-growth
  growth_divisions: 16
  growth_max_depth: 16
  growth_min_epochs: 6
  growth_epoch_ramp: fixed
  epochs: 6
  optimizer: rmsprop
  lr: 0.003
  rmsprop_beta: 0.999
  lr_schedule: warmup-cosine
  warmup_epochs: 0
  partition_depth: 1
  chunk_queries: 50000
  anc_grad: true
  quiet: true

eval:
  split: tail-heldout
  task_name: shake_growth_ppl
  batch_size: 1
  device: cpu
