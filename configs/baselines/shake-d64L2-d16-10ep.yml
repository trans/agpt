# Standard Shakespeare baseline:
# - corpus: full Shakespeare (data/input.txt)
# - model: data/input.model (d_model=64, L=2, d_ff=256, vocab=65)
# - trie depth d=16
# - 10 epochs static (single growth stage = full corpus)
# - canonical recipe: rmsprop 3e-3, warmup-cosine, anc-grad
#
# Established as the first non-smoke backfill under the new orchestrator.
# Use this as the reference number for the small-model Shakespeare baseline.

meta:
  description: "Standard small-model Shakespeare baseline, d=16 10 SE"
  experiment: shake-small-baseline
  run_slug: d64L2-d16-10ep

corpus:
  path: data/input.txt

model:
  init_from: data/input.model

train:
  mode: train-growth
  growth_frontiers: full
  growth_max_depth: 16
  growth_min_epochs: 10
  growth_epoch_ramp: linear
  epochs: 10
  optimizer: rmsprop
  lr: 0.003
  rmsprop_beta: 0.999
  lr_schedule: warmup-cosine
  warmup_epochs: 0
  partition_depth: 1
  accumulate: false
  chunk_queries: 50000
  anc_grad: true
  quiet: true

eval:
  text_file: data/input.txt
  task_name: shake_ppl
  batch_size: 1
  device: cpu
