# Migrated from shake-sgd-d64L2-s16-10k.yml via tools/migrate_config.py.
# Run with: bin/agpt_experiment --config <this> --trainer microgpt

description: "Crystal \xB5GPT SGD baseline, Shakespeare d64 L2 seq_len=16 10k steps"
experiment: shake-sgd-baseline
run_slug: d64L2-s16-10k
corpus:
  path: data/.splits/2b7ded401e96b610/train_corpus.txt
  heldout: data/.splits/2b7ded401e96b610/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: tail
    ratio: 0.05
model:
  init_file: data/input.model
train:
  budget:
    unit: steps
    value: 10000
  seed: 42
  optimizer:
    name: adam
    lr: 0.0003
  lr_schedule:
    name: constant
    warmup_epochs: 0
  seq_len: 16
  backend: openblas
eval:
  batch_size: 1
  device: cpu
