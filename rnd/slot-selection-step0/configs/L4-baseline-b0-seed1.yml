# Slot-selection Step 0 L=4 paired runs (auto-generated).
# See notes/seq-len-extension/slot-selection.md.
# Tests whether deeper model (L=4 vs L=2) changes the backoff result.
# Init model: data/input-d64-L4.model (d=64, n_heads=4, L=4, d_ff=256, vocab=65, init seed=42).

description: "Slot-selection Step 0 control: B=0, pd=0, 25ep, Shakespeare d=16, L=4, seed=1"
experiment: slot-selection-step0
run_slug: L4-baseline-b0-seed1

corpus:
  path: data/.splits/2b7ded401e96b610/train_corpus.txt
  heldout: data/.splits/2b7ded401e96b610/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: tail
    ratio: 0.05

trie:
  path: /tmp/shake_d16_train_radix
  max_depth: 16

model:
  init_file: data/input-d64-L4.model

train:
  budget:
    unit: epochs
    value: 25
  seed: 1
  quiet: true
  optimizer:
    name: rmsprop
    lr: 0.003
    beta: 0.999
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  partition_depth: 0
  chunk_queries: 50000
  anc_grad: true

experimental:
  backoff_slots: 0

eval:
  batch_size: 1
  device: cpu
