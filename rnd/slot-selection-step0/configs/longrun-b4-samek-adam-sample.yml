# Slot-selection Step 0 — long-run B=4 same-as-k matching Codex's recipe.
# Single seed (no triplet), v1 trainer, adam lr=1.5e-3 cosine,
# sample-mode carve (matches Codex's held-out), 100 epochs.
#
# Paired with longrun-b0-adam-sample.yml. Goal: measure backoff
# effect in a converged-optimizer regime on the same held-out
# distribution Codex uses.

description: "Slot-selection Step 0 longrun: B=4 same-as-k, adam lr=1.5e-3, sample carve, 100ep, seed=42"
experiment: slot-selection-step0
run_slug: longrun-b4-samek-adam-sample

corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: sample
    ratio: 0.05
    chunks: 10
    seed: 42

trie:
  path: /tmp/shake_d16_train_sampled_radix
  max_depth: 16

model:
  init_file: data/input.model

train:
  budget:
    unit: epochs
    value: 100
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.0015
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  partition_depth: 0
  chunk_queries: 50000
  anc_grad: true

experimental:
  backoff_slots: 4
  backoff_position: same-as-k

eval:
  batch_size: 1
  device: cpu
