# Slot-selection Step 0 paired runs (auto-generated).
# See notes/seq-len-extension/slot-selection.md.
#
# Run as: bin/agpt_experiment --config <this> --trainer v1
# (seed is embedded in train.seed because the orchestrator's config_sha
# does NOT incorporate --seed; 3 seeds per condition × 3 conditions = 9
# distinct config files.)

description: "Slot-selection Step 0: B=4 sentinel, pd=0, 25ep, Shakespeare d=16, seed=2"
experiment: slot-selection-step0
run_slug: backoff-b4-sentinel-seed2

corpus:
  path: data/.splits/2b7ded401e96b610/train_corpus.txt
  heldout: data/.splits/2b7ded401e96b610/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: tail
    ratio: 0.05

trie:
  path: /tmp/shake_d16_train_radix
  max_depth: 16

model:
  init_file: data/input.model

train:
  budget:
    unit: epochs
    value: 25
  seed: 2
  quiet: true
  optimizer:
    name: rmsprop
    lr: 0.003
    beta: 0.999
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  partition_depth: 0
  chunk_queries: 50000
  anc_grad: true

experimental:
  backoff_slots: 4
  backoff_position: sentinel

eval:
  batch_size: 1
  device: cpu
