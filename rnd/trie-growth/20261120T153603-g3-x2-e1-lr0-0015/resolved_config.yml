---
description: 'trie growth: growth pd=3 + crown, shuffled, doubling from 1,000 starts,
  1 pass(es) a stage, Adam lr 0.0015 warmup-cosine per step'
experiment: trie-growth
run_slug: g3-x2-e1-lr0.0015
corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
trie:
  prune_min_mass: 1
  prune_min_depth: 0
  path: data/.tries/64e9fe109211b366
  virtual_tree: false
model:
  init_file: rnd/cudax-d16-linear-mass-rerun/seeds/shake-d64L2-h4-dff256-d16-seed42.model
  save_file: rnd/trie-growth/20261120T153603-g3-x2-e1-lr0-0015/checkpoint.model
train:
  budget:
    unit: epochs
    value: 1
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.0015
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
    min_lr_ratio: 0.0
  max_depth: 16
  seq_len: 16
  partition_depth: 3
  chunk_queries: 50000
  anc_grad: true
  growth:
    divisions: 0
    min_epochs: 1
    epoch_ramp: fixed
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  anc_grad_exact: true
  train_crown: true
  unit_order_seed: 1
  growth_start: 1000
  growth_ratio: 2
  growth_exact_schedule: true
