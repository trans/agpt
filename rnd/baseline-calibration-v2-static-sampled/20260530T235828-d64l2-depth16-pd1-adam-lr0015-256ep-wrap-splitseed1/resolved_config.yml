---
description: 'V2 static sampled-heldout calibration: d64 L2 depth16 pd1 Adam lr0.0015
  256 epochs, wrapped trie tail, split seed 1'
experiment: baseline-calibration-v2-static-sampled
run_slug: d64L2-depth16-pd1-adam-lr0015-256ep-wrap-splitseed1
corpus:
  path: data/.splits/30e6aec9b3d3278b/train_corpus.txt
  heldout: data/.splits/30e6aec9b3d3278b/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: sample
    ratio: 0.05
    chunks: 10
    seed: 1
trie:
  prune_min_mass: 1
  prune_min_depth: 0
  path: data/.tries/eeca1413fe3112f0
  virtual_tree: false
model:
  init_file: data/seeds/shake-d64L2-h4-dff256-s128-seed42.model
  save_file: rnd/baseline-calibration-v2-static-sampled/20260530T235828-d64l2-depth16-pd1-adam-lr0015-256ep-wrap-splitseed1/checkpoint.model
train:
  budget:
    unit: epochs
    value: 256
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.0015
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  partition_depth: 1
  chunk_queries: 50000
  anc_grad: true
  checkpoint_epochs:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  - 128
  - 256
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
