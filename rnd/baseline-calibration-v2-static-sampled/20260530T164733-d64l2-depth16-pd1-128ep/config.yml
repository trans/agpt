description: "V2 static sampled-heldout calibration: d64 L2 depth16 pd1 128 epochs"
experiment: baseline-calibration-v2-static-sampled
run_slug: d64L2-depth16-pd1-128ep

corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: sample
    ratio: 0.05
    chunks: 10
    seed: 42

model:
  init_file: data/seeds/shake-d64L2-h4-dff256-s128-seed42.model

train:
  budget:
    unit: epochs
    value: 128
  quiet: true
  optimizer:
    name: rmsprop
    lr: 0.003
    beta: 0.999
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  partition_depth: 1
  chunk_queries: 50000
  anc_grad: true
  checkpoint_epochs:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
    - 128

eval:
  batch_size: 1
  device: cpu
