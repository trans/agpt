description: "V2 static sampled-heldout calibration: d128 L6 depth16 pd1 Adam lr0.0010 log mass 32 epochs, wrapped trie tail"
experiment: baseline-calibration-v2-static-sampled
run_slug: d128L6-depth16-pd1-adam-lr0010-logmass-32ep-wrap

corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: sample
    ratio: 0.05
    chunks: 10
    seed: 42

model:
  init_file: rnd/cudax-section2-progressive/seeds/shake-d128L6-h8-dff512-d16-seed42.model

train:
  budget:
    unit: epochs
    value: 32
  quiet: true
  optimizer:
    name: adam
    lr: 0.0010
    momentum_beta: 0.9
    beta: 0.999
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  partition_depth: 1
  chunk_queries: 50000
  anc_grad: true
  mass_weight: log
  checkpoint_epochs:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32

eval:
  batch_size: 1
  device: cpu
