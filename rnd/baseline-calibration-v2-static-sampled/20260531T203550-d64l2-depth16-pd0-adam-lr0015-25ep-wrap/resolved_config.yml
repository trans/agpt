---
description: 'V2 static sampled-heldout calibration: d64 L2 depth16 pd0 Adam lr0.0015
  25 epochs, wrapped trie tail'
experiment: baseline-calibration-v2-static-sampled
run_slug: d64L2-depth16-pd0-adam-lr0015-25ep-wrap
corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: sample
    ratio: 0.05
    chunks: 10
    seed: 42
trie:
  prune_min_mass: 1
  prune_min_depth: 0
  path: data/.tries/64e9fe109211b366
  virtual_tree: false
model:
  init_file: data/seeds/shake-d64L2-h4-dff256-s128-seed42.model
  save_file: rnd/baseline-calibration-v2-static-sampled/20260531T203550-d64l2-depth16-pd0-adam-lr0015-25ep-wrap/checkpoint.model
train:
  budget:
    unit: epochs
    value: 25
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.0015
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  partition_depth: 0
  chunk_queries: 50000
  anc_grad: true
  checkpoint_epochs:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 25
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
