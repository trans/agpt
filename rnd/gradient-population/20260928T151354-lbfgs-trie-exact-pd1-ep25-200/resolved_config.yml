---
description: 'Exp 8: L-BFGS on the EXACT trie gradient (anc_grad_exact), otherwise
  identical to Exp 7 (pd1 units accumulated into one pass per evaluation, history
  20, Armijo), 200 evaluations from the pd1 Adam epoch-25 checkpoint'
experiment: gradient-population
run_slug: lbfgs-trie-exact-pd1-ep25-200
corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
trie:
  prune_min_mass: 1
  prune_min_depth: 0
  path: data/.tries/64e9fe109211b366
  virtual_tree: false
model:
  init_file: rnd/gradient-population/20260924T205951-cadence-pd1-100ep/checkpoint.epoch_000025.model
  save_file: rnd/gradient-population/20260928T151354-lbfgs-trie-exact-pd1-ep25-200/checkpoint.model
train:
  budget:
    unit: epochs
    value: 200
  seed: 42
  quiet: true
  optimizer:
    name: lbfgs
    lr: 1.0
    history: 20
  lr_schedule:
    name: constant
    warmup_epochs: 0
    min_lr_ratio: 0.0
  max_depth: 16
  seq_len: 16
  partition_depth: 1
  chunk_queries: 50000
  anc_grad: true
  checkpoint_epochs:
  - 100
  - 200
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  anc_grad_exact: true
