---
description: "Exp 8: Adam pd=1 100 epochs from the seed with the EXACT ancestor backward (anc_grad_exact); otherwise identical to cadence-pd1-100ep (the post-fix baseline, rolling byte 5.348)"
experiment: gradient-population
run_slug: adam-pd1-exact-100ep
corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
trie:
  prune_min_mass: 1
  prune_min_depth: 0
  path: data/.tries/64e9fe109211b366
  virtual_tree: false
model:
  init_file: rnd/cudax-d16-linear-mass-rerun/seeds/shake-d64L2-h4-dff256-d16-seed42.model
train:
  budget:
    unit: epochs
    value: 100
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.0015
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  seq_len: 16
  partition_depth: 1
  chunk_queries: 50000
  anc_grad: true
  checkpoint_epochs:
    - 25
    - 50
    - 100
eval:
  split: tail-heldout
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  anc_grad_exact: true
