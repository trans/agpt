---
description: Cadence test, uniform pd=0 (one update per full trie) — matched post-fix
  control for the website card; d64 L2 depth16 seq16 Adam lr0.0015 warmup-cosine 100
  epochs, fixed kernels
experiment: gradient-population
run_slug: cadence-pd0-100ep
corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
trie:
  prune_min_mass: 1
  prune_min_depth: 0
  path: data/.tries/64e9fe109211b366
  virtual_tree: false
model:
  init_file: rnd/cudax-d16-linear-mass-rerun/seeds/shake-d64L2-h4-dff256-d16-seed42.model
  save_file: rnd/gradient-population/20260928T004439-cadence-pd0-100ep/checkpoint.model
train:
  budget:
    unit: epochs
    value: 100
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.0015
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
    min_lr_ratio: 0.0
  max_depth: 16
  seq_len: 16
  partition_depth: 0
  chunk_queries: 50000
  anc_grad: true
  checkpoint_epochs:
  - 25
  - 50
  - 100
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
