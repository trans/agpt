---
description: 'Precondition @ Codex best recipe + d_pre=16 GRU + post-LN1 inject: d128
  L6 pd1 adam lr=1e-3 wd=0.01 (AdamW) 128ep d=16'
experiment: precondition-d128L6
run_slug: precondition-d128L6-seed1
corpus:
