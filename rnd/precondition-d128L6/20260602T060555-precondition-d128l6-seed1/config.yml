description: "Precondition @ Codex best recipe + d_pre=16 GRU + post-LN1 inject: d128 L6 pd1 adam lr=1e-3 wd=0.01 (AdamW) 128ep d=16"
experiment: precondition-d128L6
run_slug: precondition-d128L6-seed1

corpus:
  path: data/.splits/2b7ded401e96b610/train_corpus.txt
  heldout: data/.splits/2b7ded401e96b610/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: tail
    ratio: 0.05

trie:
  path: /tmp/shake_d16_train_radix
  max_depth: 16

model:
  init_file: data/seeds/shake-d128-L6-h8-dff512-seed42.model
  d_model: 128
  n_layers: 6
  n_heads: 8
  d_ff: 512

train:
  budget:
    unit: epochs
    value: 128
  seed: 1
  quiet: true
  optimizer:
    name: adam
    lr: 0.0010
    beta: 0.999
    momentum_beta: 0.9
    weight_decay: 0.01
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  partition_depth: 1
  chunk_queries: 20000
  anc_grad: true
  mass_weight: linear

experimental:
  precondition:
    d_pre: 16

eval:
  batch_size: 1
  device: cpu
