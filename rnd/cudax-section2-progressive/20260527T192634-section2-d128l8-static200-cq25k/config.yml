meta:
  description: "CUDAX static full-prefix training with Section 2 event-count weighting: d128 L8, 200 epochs, chunk_queries=25000"
  experiment: cudax-section2-progressive
  run_slug: section2-d128L8-static200-cq25k

corpus:
  path: data/input.txt
  train_frac: 0.95
  vocab_source: data/input.txt

model:
  init_from: rnd/cudax-section2-progressive/seeds/shake-d128L8-h8-dff512-d16-seed42.model

train:
  tool: bin/agpt_train_v2
  mode: train-growth
  growth_divisions: 1
  growth_max_depth: 16
  growth_min_epochs: 200
  growth_epoch_ramp: fixed
  epochs: 200
  optimizer: rmsprop
  lr: 0.003
  rmsprop_beta: 0.999
  lr_schedule: warmup-cosine
  warmup_epochs: 0
  partition_depth: 1
  chunk_queries: 25000
  anc_grad: true
  quiet: true

eval:
  split: tail-heldout
  task_name: shake_static_ppl
  batch_size: 1
  device: cpu
