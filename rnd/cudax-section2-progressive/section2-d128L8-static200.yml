# Migrated from section2-d128L8-static200.yml via tools/migrate_config.py.
# Run with: bin/agpt_experiment --config <this> --trainer v2

description: 'CUDAX static full-prefix training with Section 2 event-count weighting:
  d128 L8, 200 epochs'
experiment: cudax-section2-progressive
run_slug: section2-d128L8-static200
corpus:
  path: data/.splits/2b7ded401e96b610/train_corpus.txt
  heldout: data/.splits/2b7ded401e96b610/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: tail
    ratio: 0.05
model:
  init_file: rnd/cudax-section2-progressive/seeds/shake-d128L8-h8-dff512-d16-seed42.model
train:
  budget:
    unit: epochs
    value: 200
  quiet: true
  optimizer:
    name: rmsprop
    lr: 0.003
    beta: 0.999
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  partition_depth: 1
  chunk_queries: 50000
  anc_grad: true
  growth:
    divisions: 1
    min_epochs: 200
    epoch_ramp: fixed
eval:
  batch_size: 1
  device: cpu
