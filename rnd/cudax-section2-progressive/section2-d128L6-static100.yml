meta:
  description: "CUDAX static full-prefix training with Section 2 event-count weighting: d128 L6, 100 epochs"
  experiment: cudax-section2-progressive
  run_slug: section2-d128L6-static100

corpus:
  path: data/input.txt
  train_frac: 0.95
  vocab_source: data/input.txt

model:
  init_from: rnd/cudax-section2-progressive/seeds/shake-d128L6-h8-dff512-d16-seed42.model

train:
  tool: bin/agpt_train_v2
  mode: train-growth
  growth_divisions: 1
  growth_max_depth: 16
  growth_min_epochs: 100
  growth_epoch_ramp: fixed
  epochs: 100
  optimizer: rmsprop
  lr: 0.003
  rmsprop_beta: 0.999
  lr_schedule: warmup-cosine
  warmup_epochs: 0
  partition_depth: 1
  chunk_queries: 50000
  anc_grad: true
  quiet: true

eval:
  split: tail-heldout
  task_name: shake_static_ppl
  batch_size: 1
  device: cpu
