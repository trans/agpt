---
description: 'context-tree orientation, attention grouping control, cosine check:
  d64/L2 attention, depth 16, steps group events by their context''s oldest character
  (AGPT''s prefix-trie pd=1 units); 65 steps per pass in a new random order, 16 passes,
  Adam lr 0.006 warmup-cosine (1 pass of warmup), order seed 1'
experiment: context-tree-orientation
run_slug: att-cfirst-lr0.006
corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
model:
  init_file: rnd/cudax-d16-linear-mass-rerun/seeds/shake-d64L2-h4-dff256-d16-seed42.model
  save_file: rnd/context-tree-orientation/20261117T103409-att-cfirst-lr0-006/checkpoint.model
train:
  budget:
    unit: epochs
    value: 16
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.006
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 1
    min_lr_ratio: 0.0
  seq_len: 16
  checkpoint_epochs:
  - 4
  - 8
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  trie_plan: group
  trie_plan_group: first
  trie_plan_seed: 1
  wrap_tail: true
  device: cuda
