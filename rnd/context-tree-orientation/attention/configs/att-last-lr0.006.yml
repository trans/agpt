---
description: "context-tree orientation, attention grouping control: d64/L2 attention, depth 16, steps group events by their context's newest character (the suffix tree's pd=1 units); 65 steps per pass in a new random order, 16 passes, Adam lr 0.006 constant, order seed 1"
experiment: context-tree-orientation
run_slug: att-last-lr0.006
corpus:
