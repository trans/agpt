---
description: 'Hybrid V2 attention AGPT: pd1-100 checkpoint + traversal-stop context-only
  stochastic refinement, d64 L2 depth16 seq_len16 Adam lr0.00003 cosine floor 10%,
  10000 sampled units x2 repeats'
experiment: hybrid-agpt
run_slug: d64L2-depth16-pd1-100ep-traversal-u10000-r2-lr00003-contextonly-cosfloor10
corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
trie:
  prune_min_mass: 1
  prune_min_depth: 0
  path: data/.tries/64e9fe109211b366
  virtual_tree: false
model:
  init_file: rnd/stochastic-agpt/20260611T160456-d64l2-depth16-pd1-100ep/checkpoint.model
  save_file: rnd/hybrid-agpt/20260612T215441-d64l2-depth16-pd1-100ep-traversal-u10000-r2-lr00003-contexto/checkpoint.model
train:
  budget:
    unit: epochs
    value: 1
  seed: 42
  quiet: false
  optimizer:
    name: adam
    lr: 3.0e-5
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
    min_lr_ratio: 0.1
  max_depth: 16
  seq_len: 16
  partition_depth: 1
  chunk_queries: 20000
  anc_grad: true
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
lightning:
  enabled: true
  updates: 10000
  query_budget: 20000
  seed: 42
  anchor_mode: traversal-stop
  repeats_per_sample: 2
