---
description: "refined trie counts: AGPT pd=3 replay, d64/L2, depth 8, the 4.75M PG-19 text's own trie; 3 passes, Adam 0.003 constant"
experiment: refined-trie-counts
run_slug: agpt-5m
corpus:
  path: data/pg19/imm-split/train_corpus.txt
  heldout: data/pg19/imm-split/heldout_corpus.txt
  vocab_source: data/pg19/imm-split/vocab.txt
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 256
  init_seed: 42
train:
  budget:
    unit: epochs
    value: 3
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.003
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: constant
  seq_len: 8
  checkpoint_epochs: [1, 2]
eval:
  split: tail-heldout
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  device: cuda
  trie_plan: pd
  trie_plan_depth: 3
  trie_plan_seed: 1
