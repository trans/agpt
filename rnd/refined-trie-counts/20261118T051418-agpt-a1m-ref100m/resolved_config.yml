---
description: 'refined trie counts: AGPT pd=3 replay, d64/L2, depth 8, the 1M PG-19
  slice''s trie with its child counts from the 100M PG-19 text containing it; 8 passes,
  Adam 0.003 constant, order seed 1'
experiment: refined-trie-counts
run_slug: agpt-a1m-ref100m
corpus:
  path: data/pg19/a1m/train_corpus.txt
  heldout: data/pg19/imm-split/heldout_corpus.txt
  vocab_source: data/pg19/imm-split/vocab.txt
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 256
  init_seed: 42
  save_file: rnd/refined-trie-counts/20261118T051418-agpt-a1m-ref100m/checkpoint.model
train:
  budget:
    unit: epochs
    value: 8
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.003
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: constant
    warmup_epochs: 0
    min_lr_ratio: 0.0
  seq_len: 8
  checkpoint_epochs:
  - 1
  - 2
  - 4
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  device: cuda
  trie_plan: pd
  trie_plan_depth: 3
  trie_plan_seed: 1
  trie_targets: true
  trie_targets_corpus: data/pg19/imm-split-100m/train_corpus.txt
  trie_targets_corpus_sha256: fc55205ead4c13554ab2992b5891263aad822956618d801720dab840af124c54
