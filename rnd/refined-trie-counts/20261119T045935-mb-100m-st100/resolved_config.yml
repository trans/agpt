---
description: 'refined trie counts: minibatch (128 windows a step), d64/L2, depth 8,
  the 100M PG-19 text itself, hard targets, windows every 100 characters from a random
  offset each epoch (1M windows, 7,813 steps an epoch); 25 epochs, Adam 0.003 constant'
experiment: refined-trie-counts
run_slug: mb-100m-st100
corpus:
  path: data/pg19/imm-split-100m/train_corpus.txt
  heldout: data/pg19/imm-split/heldout_corpus.txt
  vocab_source: data/pg19/imm-split/vocab.txt
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 256
  init_seed: 42
  save_file: rnd/refined-trie-counts/20261119T045935-mb-100m-st100/checkpoint.model
train:
  budget:
    unit: epochs
    value: 25
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.003
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: constant
    warmup_epochs: 0
    min_lr_ratio: 0.0
  seq_len: 8
  checkpoint_epochs:
  - 1
  - 2
  - 4
  - 8
  - 16
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  device: cuda
  window_stride: 100
