---
description: 'refined trie counts: minibatch (128 windows a step), d64/L2, depth 8,
  the 1M PG-19 slice with each context''s next-token distribution from the slice itself
  (trie targets, own counts); 8 epochs, Adam 0.003 constant'
experiment: refined-trie-counts
run_slug: mb-a1m-tt
corpus:
  path: data/pg19/a1m/train_corpus.txt
  heldout: data/pg19/imm-split/heldout_corpus.txt
  vocab_source: data/pg19/imm-split/vocab.txt
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 256
  init_seed: 42
  save_file: rnd/refined-trie-counts/20261118T060001-mb-a1m-tt/checkpoint.model
train:
  budget:
    unit: epochs
    value: 8
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.003
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: constant
    warmup_epochs: 0
    min_lr_ratio: 0.0
  seq_len: 8
  checkpoint_epochs:
  - 1
  - 2
  - 4
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  device: cuda
  trie_targets: true
