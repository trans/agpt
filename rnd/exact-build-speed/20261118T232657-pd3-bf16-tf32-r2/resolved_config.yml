---
description: 'exact-build speed, bf16 K/V cache, TF32 matmuls (the normal build),
  repeat 2: one-pass gap, cadence: AGPT pd=3 + crown units (depth-16 trie, exact ancestor
  gradient, shuffled each pass), 1 pass(es), Adam lr 0.0015 warmup-cosine per step'
experiment: exact-build-speed
run_slug: pd3-bf16-tf32-r2
corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
trie:
  prune_min_mass: 1
  prune_min_depth: 0
  path: data/.tries/64e9fe109211b366
  virtual_tree: false
model:
  init_file: rnd/cudax-d16-linear-mass-rerun/seeds/shake-d64L2-h4-dff256-d16-seed42.model
  save_file: rnd/exact-build-speed/20261118T232657-pd3-bf16-tf32-r2/checkpoint.model
train:
  budget:
    unit: epochs
    value: 1
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.0015
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
    min_lr_ratio: 0.0
  max_depth: 16
  seq_len: 16
  partition_depth: 3
  chunk_queries: 50000
  anc_grad: true
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  anc_grad_exact: true
  train_crown: true
  unit_order_seed: 1
