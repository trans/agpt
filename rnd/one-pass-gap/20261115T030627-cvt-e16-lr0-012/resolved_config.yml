---
description: 'one-pass gap, next: conventional epochs with trie targets (each position''s
  target is the trie''s next-character distribution for its context), 16 epoch(s),
  Adam lr 0.012 warmup-cosine per step'
experiment: one-pass-gap
run_slug: cvt-e16-lr0.012
corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
model:
  init_file: rnd/cudax-d16-linear-mass-rerun/seeds/shake-d64L2-h4-dff256-d16-seed42.model
  save_file: rnd/one-pass-gap/20261115T030627-cvt-e16-lr0-012/checkpoint.model
train:
  budget:
    unit: epochs
    value: 16
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.012
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
    min_lr_ratio: 0.0
  seq_len: 16
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  minibatch_size: 128
  window_stride: 16
  trie_targets: true
  device: cuda
