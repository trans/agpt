---
description: 'one-pass gap, longer windows: conventional epochs at seq_len 128 with
  trie targets (16 windows of 128 per step), 1 epoch(s), Adam lr 0.006 warmup-cosine
  per step'
experiment: one-pass-gap
run_slug: cvt128-e1-lr0.006
corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt
model:
  init_file: rnd/cudax-d16-linear-mass-rerun/seeds/shake-d64L2-h4-dff256-d16-seed42.model
  save_file: rnd/one-pass-gap/20261115T080843-cvt128-e1-lr0-006/checkpoint.model
train:
  budget:
    unit: epochs
    value: 1
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.006
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
    min_lr_ratio: 0.0
  seq_len: 128
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  minibatch_size: 16
  window_stride: 128
  trie_targets: true
  device: cuda
