description: "V2 attention Lightning AGPT random-descendants KISS baseline: d64 L2 depth16 seq_len16 Adam lr0.0015 cosine floor 10%, 20000 random full-subtree units x6 repeats"
experiment: lightning-agpt
run_slug: d64L2-depth16-lightning-random-desc-u20000-r6-cosfloor10

corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt

model:
  init_file: rnd/cudax-d16-linear-mass-rerun/seeds/shake-d64L2-h4-dff256-d16-seed42.model

train:
  budget:
    unit: epochs
    value: 1
  quiet: false
  optimizer:
    name: adam
    lr: 0.0015
    momentum_beta: 0.9
    beta: 0.999
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
    min_lr_ratio: 0.1
  seq_len: 16
  max_depth: 16
  partition_depth: 1
  chunk_queries: 20000
  anc_grad: true

lightning:
  enabled: true
  updates: 20000
  anchor_mode: random-descendants
  seed: 42
  repeats_per_sample: 6

eval:
  batch_size: 1
  device: cpu
