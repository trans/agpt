description: "V2 attention Lightning AGPT streamed: d64 L2 depth16 seq_len16 Adam constant lr0.00075, 10000 sampled mini-trees x2 repeats"
experiment: lightning-agpt
run_slug: d64L2-depth16-lightning-stream-u10000-q20k-r2-constlr00075

corpus:
  path: data/.splits/4fa9aec1db6b3aea/train_corpus.txt
  heldout: data/.splits/4fa9aec1db6b3aea/heldout_corpus.txt
  vocab_source: data/input.txt

model:
  init_file: rnd/cudax-d16-linear-mass-rerun/seeds/shake-d64L2-h4-dff256-d16-seed42.model

train:
  budget:
    unit: epochs
    value: 1
  quiet: false
  optimizer:
    name: adam
    lr: 0.00075
    momentum_beta: 0.9
    beta: 0.999
  lr_schedule:
    name: constant
    warmup_epochs: 0
  seq_len: 16
  max_depth: 16
  partition_depth: 1
  chunk_queries: 20000
  anc_grad: true

lightning:
  enabled: true
  updates: 10000
  query_budget: 20000
  seed: 42
  stop_p: 0.35
  sample_fanout: 16
  anchors_per_step: 1
  repeats_per_sample: 2

eval:
  batch_size: 1
  device: cpu
