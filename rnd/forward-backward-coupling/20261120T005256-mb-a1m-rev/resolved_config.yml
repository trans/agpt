---
description: 'forward-backward coupling: the backward model, minibatch (128 windows
  a step), d64/L2, depth 8, the 1M PG-19 slice; 8 epochs, Adam 0.003 constant, on
  the reversed slice, scored on the reversed held-out chunks'
experiment: forward-backward-coupling
run_slug: mb-a1m-rev
corpus:
  path: data/pg19/a1m-rev/train_corpus.txt
  heldout: data/pg19/imm-split-rev/heldout_corpus.txt
  vocab_source: data/pg19/imm-split/vocab.txt
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 256
  init_seed: 42
  save_file: rnd/forward-backward-coupling/20261120T005256-mb-a1m-rev/checkpoint.model
train:
  budget:
    unit: epochs
    value: 8
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.003
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: constant
    warmup_epochs: 0
    min_lr_ratio: 0.0
  seq_len: 8
  checkpoint_epochs:
  - 1
  - 2
  - 4
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  device: cpu
