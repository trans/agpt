description: "Variance check, seed 1, harmonic bias W=64 n_freq=16. Pairs with seed1-baseline.yml."
experiment: harmonic-bias-prototype
run_slug: seed1-bias

corpus:
  path: data/.splits/2b7ded401e96b610/train_corpus.txt
  heldout: data/.splits/2b7ded401e96b610/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: tail
    ratio: 0.05

model:
  init_file: data/input.model

train:
  budget: { unit: epochs, value: 10 }
  seed: 1
  quiet: true
  optimizer:
    name: rmsprop
    lr: 0.003
    beta: 0.999
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 1
  max_depth: 16

experimental:
  batch_size: 128
  harmonic_bias: true
  bias_window: 64
  bias_n_freq: 16

eval:
  batch_size: 64
  device: cuda
