# Migrated from seed1-bias.yml via tools/migrate_config.py.

description: Harmonic bias enabled (asym-DFT, W=64, n_freq=16), seed 1
experiment: harmonic-bias-prototype
run_slug: seed1-bias
corpus:
  path: data/.splits/2b7ded401e96b610/train_corpus.txt
  heldout: data/.splits/2b7ded401e96b610/heldout_corpus.txt
  carve:
    source: data/input.txt
    mode: tail
    ratio: 0.05
model:
  init_file: data/input.model
train:
  budget:
    unit: epochs
    value: 10
  quiet: true
  optimizer:
    name: rmsprop
    lr: 0.003
    beta: 0.999
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 1
  max_depth: 16
eval:
  batch_size: 64
  device: cuda
