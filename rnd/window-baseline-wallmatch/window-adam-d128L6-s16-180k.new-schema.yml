description: 'Standard window-training baseline: d128 L6 seq_len=16, ~wall-time matched
  to CUDAX d128/L6 static200'
experiment: window-baseline-wallmatch
run_slug: window-adam-d128L6-s16-180k
corpus:
  path: data/.splits/2b7ded401e96b610/train_corpus.txt
  heldout: data/.splits/2b7ded401e96b610/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: tail
    ratio: 0.05
model:
  init_file: rnd/cudax-section2-progressive/seeds/shake-d128L6-h8-dff512-d16-seed42.model
train:
  budget:
    unit: steps
    value: 180000
  seed: 42
  optimizer:
    name: adam
    lr: 0.0003
  lr_schedule:
    name: constant
    warmup_epochs: 0
  seq_len: 16
  backend: openblas
eval:
  batch_size: 1
  device: cpu
