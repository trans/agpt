  optimizer:
    name: adam
    lr: 0.0015
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  partition_depth: 1
  chunk_queries: 50000
  anc_grad: true
  checkpoint_epochs:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  - 128
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
