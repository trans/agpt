---
description: 'V2 static tail-heldout comparison: d64 L2 depth16 pd1 Adam lr0.0015
  128 epochs'
experiment: baseline-calibration-v2-static-tail
run_slug: d64L2-depth16-pd1-adam-lr0015-tail-128ep
corpus:
  path: data/.splits/2b7ded401e96b610/train_corpus.txt
  heldout: data/.splits/2b7ded401e96b610/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: tail
    ratio: 0.05
trie:
  prune_min_mass: 1
  prune_min_depth: 0
  path: data/.tries/a4b8711ebe873979
  virtual_tree: false
model:
  init_file: data/seeds/shake-d64L2-h4-dff256-s128-seed42.model
