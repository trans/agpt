---
description: 'Precondition Step 1: d_pre=16 mean-pool, adam lr=1.5e-3, sample carve,
  25ep, seed=1'
experiment: precondition-step1
run_slug: precondition-d16-seed1
corpus:
  path: data/.splits/2b7ded401e96b610/train_corpus.txt
  heldout: data/.splits/2b7ded401e96b610/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: tail
    ratio: 0.05
trie:
  max_depth: 16
  prune_min_mass: 1
  prune_min_depth: 0
  path: /tmp/shake_d16_train_radix
  virtual_tree: false
model:
  init_file: data/input.model
  save_file: rnd/precondition-step1/20260601T211648-precondition-d16-seed1/checkpoint.model
train:
  budget:
    unit: epochs
    value: 25
  seed: 1
  quiet: true
  optimizer:
    name: adam
    lr: 0.0015
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  partition_depth: 0
  chunk_queries: 50000
  anc_grad: true
eval:
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  precondition:
    d_pre: 16
