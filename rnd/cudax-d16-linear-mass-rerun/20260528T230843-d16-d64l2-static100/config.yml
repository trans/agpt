# NEW-SCHEMA migration of d16-d64L2-static100.yml
#
# Drop-in equivalent of the same-named .yml under the new canonical
# YAML schema (docs/yaml-schema.md). Held for testing once v2's --config
# support lands. Original .yml is preserved for legacy orchestrator runs.

description: "CUDAX d16 rerun: baseline-size d64 L2, linear count/event weighting, 100 static epochs"
experiment: cudax-d16-linear-mass-rerun
run_slug: d16-d64L2-static100

corpus:
  # Carved (tail-95/5) via `bin/agpt_carve --source data/input.txt --mode tail --ratio 0.05`
  # The path points at the cached split's train file; carve block is provenance.
  path: data/.splits/2b7ded401e96b610/train_corpus.txt
  heldout: data/.splits/2b7ded401e96b610/heldout_corpus.txt
  vocab_source: data/input.txt
  carve:
    source: data/input.txt
    mode: tail
    ratio: 0.05

model:
  init_file: rnd/cudax-d16-linear-mass-rerun/seeds/shake-d64L2-h4-dff256-d16-seed42.model
  # d_model/n_layers/n_heads omitted — taken from the init_file's checkpoint header.

train:
  budget:
    unit: epochs
    value: 100
  seed: 42
  quiet: true
  optimizer:
    name: rmsprop
    lr: 0.003
    beta: 0.999
  lr_schedule:
    name: warmup-cosine
    warmup_epochs: 0
  max_depth: 16
  partition_depth: 1
  chunk_queries: 50000
  anc_grad: true
  mass_weight: linear        # paper §2 canonical (post-0252072/816f7d0)
  fire_norm: mass            # paper §2 canonical
  # No `growth:` block — `growth_divisions: 1` in the legacy YAML was a no-op
  # (= static training). Absence of `growth:` block in the new schema is the
  # canonical way to express "static training at full depth."

eval:
  batch_size: 1
  device: cpu
  # source: holdout (the default) — eval on corpus.heldout.
  # task_name removed — orchestrator derives <run_slug>_holdout for lm-eval.
