# v1 with --mass-weight linear at 100 SE — does longer training close
# the deep-PPL gap vs unweighted? If yes, mass-weighting is just slower
# convergence at fixed capacity. If not, it's a hard capacity ceiling
# at this model size.

meta:
  description: "v1 with --mass-weight linear at 100 SE, pd=1 --no-accumulate"
  experiment: v1-vs-v2-comparison
  run_slug: v1-100SE-mwlinear

corpus:
  path: /tmp/agpt_input_prefix95.txt
  vocab_source: data/input.txt
  train_frac: 1.0

model:
  init_from: data/input.model

train:
  tool: rnd/v1-vs-v2-comparison/tools/v1_train.py
  mode: train
  growth_max_depth: 16
  epochs: 100
  optimizer: rmsprop
  lr: 0.003
  rmsprop_beta: 0.999
  lr_schedule: warmup-cosine
  warmup_epochs: 0
  partition_depth: 1
  accumulate: false
  quiet: true
  extra_args:
    - "--mass-weight"
    - "linear"

eval:
  split: external-heldout
  external_file: /tmp/shake_heldout5_v1eval.txt
  task_name: v1_shake_ppl
  batch_size: 1
  device: cuda
