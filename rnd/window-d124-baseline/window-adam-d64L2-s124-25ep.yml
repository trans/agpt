meta:
  description: "Window baseline: d64 L2 seq_len=124, about 25 corpus epochs, likely Adam-style microgpt optimizer"
  experiment: window-d124-baseline
  run_slug: window-adam-d64L2-s124-25ep

corpus:
  path: data/input.txt
  train_frac: 0.95
  vocab_source: data/input.txt

model:
  init_from: rnd/cudax-d124-probe/seeds/shake-d64L2-h4-dff256-d124-seed42.model

train:
  kind: microgpt-sgd
  tool: bin/microgpt
  steps: 214000
  seq_len: 124
  d_model: 64
  n_layers: 2
  lr: 0.0003
  lr_schedule: constant
  backend: openblas
  seed: 42

eval:
  split: tail-heldout
  task_name: shake_window_s124_ppl
  batch_size: 1
  device: cpu
