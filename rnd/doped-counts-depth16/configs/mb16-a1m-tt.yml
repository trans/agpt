---
description: "doped counts at depth 16: the 1M slice, its own counts as soft targets; minibatch (128 windows a step), d64/L2, seq_len 16, Adam 0.003 constant, train seed 42"
experiment: doped-counts-depth16
run_slug: mb16-a1m-tt
corpus:
  path: data/pg19/a1m/train_corpus.txt
  heldout: data/pg19/imm-split/heldout_corpus.txt
  vocab_source: data/pg19/imm-split/vocab.txt
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 256
  init_seed: 42
train:
  budget:
    unit: epochs
    value: 8
  seed: 42
  quiet: true
  optimizer:
    name: adam
    lr: 0.003
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: constant
  seq_len: 16
  checkpoint_epochs: [1, 2, 4]
eval:
  split: tail-heldout
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  device: cuda
  trie_targets: true
