---
description: "doped counts at depth 16: minibatch on the 100M text itself, hard targets, windows every 100 characters (1M an epoch), 25 epochs; minibatch (128 windows a step), d64/L2, seq_len 16, Adam 0.003 constant, train seed 43"
experiment: doped-counts-depth16
run_slug: mb16-100m-s43
corpus:
  path: data/pg19/imm-split-100m/train_corpus.txt
  heldout: data/pg19/imm-split/heldout_corpus.txt
  vocab_source: data/pg19/imm-split/vocab.txt
model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 256
  init_seed: 42
train:
  budget:
    unit: epochs
    value: 25
  seed: 43
  quiet: true
  optimizer:
    name: adam
    lr: 0.003
    beta: 0.999
    momentum_beta: 0.9
  lr_schedule:
    name: constant
  seq_len: 16
  checkpoint_epochs: [8, 16]
eval:
  split: tail-heldout
  train_sanity: false
  batch_size: 1
  device: cpu
experimental:
  device: cuda
  window_stride: 100
